plugins { id 'com.android.application' }

android {
    namespace 'local.pickcode.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'local.pickcode.assistant'
        minSdk 23
        targetSdk 35
        versionCode 30200
        versionName '3.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs += [
                '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
            ]
        }
    }
    buildFeatures { buildConfig true }
    packaging {
        // Compress all four ABI libraries in the download while retaining offline recognition.
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'org.mozilla:rhino:1.7.15'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Bundled models keep QR and Chinese/Latin text recognition available offline, including first use.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.17'
}

tasks.withType(Test).configureEach {
    systemProperty 'pickcode.root', rootProject.projectDir.parentFile.absolutePath
    inputs.file(rootProject.file('../core/pickcode-core.js'))
    inputs.file(rootProject.file('../server/src/logistics-rules.js'))
    inputs.file(rootProject.file('../tests/fixtures/sms-cases.json'))
}

tasks.register('verifyBundledAssets') {
    doLast {
        def bundle = file('src/main/assets/app/index.html')
        def core = file('src/main/assets/pickcode-core.js')
        def shared = rootProject.file('../core/pickcode-core.js')
        def logistics = rootProject.file('../server/src/logistics-rules.js')
        if (!bundle.isFile() || !core.isFile()) throw new GradleException('Run npm run build:h5 and npm run sync:android from the repository root first.')
        def expected = (logistics.getText('UTF-8') + '\n' + shared.getText('UTF-8')).getBytes('UTF-8')
        if (!java.util.Arrays.equals(core.bytes, expected)) throw new GradleException('Bundled core is stale; run npm run sync:android first.')
    }
}
tasks.configureEach { task ->
    if (task.name.matches('merge.*Assets')) task.dependsOn('verifyBundledAssets')
}
